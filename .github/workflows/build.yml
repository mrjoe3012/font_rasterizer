name: build

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

permissions:
    contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        debug_flag:
          - "-DDEBUG=1"
          - "-DDEBUG=0"

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: prereq
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: build-essential wget libopencv-core-dev libopencv-imgproc-dev libopencv-imgcodecs-dev
        version: ubuntu-24.04-v1
        empty_packages_behavior: error
        execute_install_scripts: false
    - name: configure
      run: mkdir build && cmake -S . -B build ${{ matrix.debug_flag }} -DCMAKE_BUILD_TYPE=Release
    - name: make
      run: cmake --build build
    - name: download_font
      run: wget 'https://github.com/edwardtufte/et-book/raw/refs/heads/gh-pages/source/4-ttf/et-book-bold-line-figures.ttf' -O font.ttf
    - name: test
      run: mkdir -p temp/vis && cd temp && ../build/FontRasterizer font.ttf
    - name: test_result
      run: cmp output.h ../test/golden.txt
