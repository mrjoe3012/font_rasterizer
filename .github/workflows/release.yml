
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}

    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - '20.04'
          - '22.04'
          - '24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prerequisites
        run: |
          apt-get update
          apt-get install -y build-essential cmake

      - name: Configure
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DDEBUG=0

      - name: Build
        run: |
          cmake --build build

      - name: Package
        run: |
          mkdir -p staging
          cp build/FontRasterizer staging/
          tar -czf myprogram-ubuntu-${{ matrix.ubuntu }}.tar.gz \
            -C staging .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu-${{ matrix.ubuntu }}
          path: myprogram-ubuntu-${{ matrix.ubuntu }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true

      - name: Create/update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi

          gh release upload "$TAG" release-assets/* --clobber
