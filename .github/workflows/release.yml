
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}

    strategy:
      fail-fast: true
      matrix:
        ubuntu:
          - '22.04'
          - '24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DDEBUG=0

      - name: Build
        run: |
          cmake --build build

      - name: Package
        run: |
          mkdir -p staging
          cp build/FontRasterizer staging/
          tar -czf FontRasterizer-ubuntu-${{ matrix.ubuntu }}.tar.gz \
            -C staging .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-ubuntu-${{ matrix.ubuntu }}
          path: FontRasterizer-ubuntu-${{ matrix.ubuntu }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v7
      - name: temp
        run: echo "hello" > temp.txt
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            temp.txt