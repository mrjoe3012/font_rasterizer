name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
    contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: prereq
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: >
          build-essential wget cmake
        version: ubuntu-24.04-v1
        empty_packages_behavior: error
        execute_install_scripts: true
    - name: configure
      run: |
        mkdir build
        cmake -S . -B build -DDEBUG=0 -DCMAKE_BUILD_TYPE=Release
    - name: make
      run: cmake --build build
    - name: test
      run: |
        wget \
          'https://github.com/edwardtufte/et-book/raw/refs/heads/gh-pages/source/4-ttf/et-book-bold-line-figures.ttf' \
          -O font.ttf
        mkdir -p temp/vis
        cd temp
        ../build/FontRasterizer ../font.ttf
        diff output.h ../test/golden.txt
